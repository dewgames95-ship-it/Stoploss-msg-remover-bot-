<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · NovaTrade</title>
<meta name="description" content="This page does not exist. Go back to NovaTrade.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
// GitHub Pages serves this for unknown paths: send users to the app root.
(function(){var b=location.pathname.split("/").filter(Boolean);var root=location.hostname.endsWith("github.io")&&b.length?"/"+b[0]+"/":"/";document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("[data-root]").forEach(function(a){a.href=root+"#/home"})})})();
</script>
</head>
<body>
<main class="app"><div class="nf"><div class="big">404</div><h1 class="h1" style="margin:8px 0">Page not found</h1><p class="sub" style="margin-bottom:24px">The page you’re looking for doesn’t exist or was moved.</p><a class="btn btn-primary" data-root href="./#/home">Back to Home</a>
</div></main>
</body>
</html>
