name: Android APK

# Builds the WebView APK and publishes it as a GitHub Release (tag apk-v<run number>).
# The installed app checks the latest release on start and offers a one-tap update.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../binary-trading.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Binary Trading APK (build ${{ github.run_number }})
          body: Web content updates automatically. Install this APK once; later builds are offered in-app.
          files: binary-trading.apk
          make_latest: true
